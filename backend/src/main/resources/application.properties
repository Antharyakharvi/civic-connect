spring.application.name=civic-connect

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/civic_connect?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT Configuration
app.jwtSecret=mySecretKeyForCivicConnectApplicationJWTTokenGeneration
app.jwtExpirationMs=86400000

# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.from=noreply@civicconnect.com

# Upload Configuration
app.upload.dir=uploads

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Logging
logging.level.com.civicconnect=INFO
