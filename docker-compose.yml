version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: civic_connect_db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: civic_connect
      MYSQL_USER: civic_user
      MYSQL_PASSWORD: civic_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - civic_network

volumes:
  mysql_data:

networks:
  civic_network:
    driver: bridge